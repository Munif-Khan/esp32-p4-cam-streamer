<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32-P4 USB Video Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 0;
      color: #3b82f6;
    }
    #controls {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      font-size: 14px;
      color: #9ca3af;
    }
    #canvas-container {
      position: relative;
      border: 2px solid #27272a;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      max-width: 90vw;
      max-height: 75vh;
    }
    #stats-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #10b981;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>ESP32-P4 USB Video Streamer</h1>
  <div id="controls">
    <button id="btnConnect">Connect via USB Serial</button>
    <span id="status">Disconnected</span>
  </div>

  <div id="canvas-container">
    <canvas id="viewCanvas" width="640" height="480"></canvas>
    <div id="stats-overlay">Waiting for stream...</div>
  </div>

  <script>
    const btnConnect = document.getElementById('btnConnect');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');
    const statsOverlay = document.getElementById('stats-overlay');

    let port = null;
    let reader = null;
    let keepReading = false;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let currentFps = 0;

    btnConnect.addEventListener('click', async () => {
      if (port) {
        keepReading = false;
        if (reader) await reader.cancel();
        if (port) await port.close();
        port = null;
        btnConnect.textContent = 'Connect via USB Serial';
        statusText.textContent = 'Disconnected';
        return;
      }

      if (!('serial' in navigator)) {
        alert('Web Serial API is not supported in this browser. Please use Google Chrome, Edge, or Opera.');
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 2000000, bufferSize: 262144 });
        btnConnect.textContent = 'Disconnect';
        statusText.textContent = 'Connected! Reading stream...';
        keepReading = true;
        readLoop();
      } catch (err) {
        statusText.textContent = 'Error: ' + err.message;
      }
    });

    async function readLoop() {
      let buffer = new Uint8Array(0);

      function appendBytes(newBytes) {
        const combined = new Uint8Array(buffer.length + newBytes.length);
        combined.set(buffer);
        combined.set(newBytes, buffer.length);
        buffer = combined;
      }

      while (port && port.readable && keepReading) {
        reader = port.readable.getReader();
        try {
          while (keepReading) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) {
              appendBytes(value);

              // Process packets starting with CAM0 (magic: 0x43, 0x41, 0x4D, 0x30)
              while (buffer.length >= 16) {
                let idx = -1;
                for (let i = 0; i <= buffer.length - 4; i++) {
                  if (buffer[i] === 0x43 && buffer[i+1] === 0x41 && buffer[i+2] === 0x4D && buffer[i+3] === 0x30) {
                    idx = i;
                    break;
                  }
                }

                if (idx === -1) {
                  // Keep last 3 bytes in case magic is split across chunks
                  buffer = buffer.slice(buffer.length - 3);
                  break;
                }

                if (idx > 0) {
                  buffer = buffer.slice(idx);
                }

                if (buffer.length < 14) break;

                const view = new DataView(buffer.buffer, buffer.byteOffset, 14);
                const payloadLength = view.getUint32(4, true);
                const width = view.getUint16(8, true);
                const height = view.getUint16(10, true);
                const fmt = view.getUint16(12, true);

                if (payloadLength > 5 * 1024 * 1024) {
                  // Corrupt length, skip magic byte
                  buffer = buffer.slice(4);
                  continue;
                }

                if (buffer.length < 14 + payloadLength) {
                  // Need more data
                  break;
                }

                const payload = buffer.slice(14, 14 + payloadLength);
                buffer = buffer.slice(14 + payloadLength);

                handleFrame(payload, width, height, fmt);
              }
            }
          }
        } catch (err) {
          console.error(err);
        } finally {
          reader.releaseLock();
        }
      }
    }

    function handleFrame(payload, width, height, fmt) {
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      if (fmt === 2) { // JPEG
        const blob = new Blob([payload], { type: 'image/jpeg' });
        const img = new Image();
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          updateFps(width, height);
        };
        img.src = url;
      } else if (fmt === 1) { // RGB565
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data;
        const u16 = new Uint16Array(payload.buffer, payload.byteOffset, payload.byteLength / 2);
        let ptr = 0;
        for (let i = 0; i < u16.length; i++) {
          const val = u16[i];
          data[ptr++] = ((val >> 11) & 0x1F) * 255 / 31;
          data[ptr++] = ((val >> 5) & 0x3F) * 255 / 63;
          data[ptr++] = (val & 0x1F) * 255 / 31;
          data[ptr++] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
        updateFps(width, height);
      }
    }

    function updateFps(w, h) {
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = (frameCount * 1000 / (now - lastFpsTime)).toFixed(1);
        frameCount = 0;
        lastFpsTime = now;
      }
      statsOverlay.textContent = `${w}x${h} | ${currentFps} FPS`;
    }
  </script>
</body>
</html>
